     zoom nativo del browser. */
  #canvas-wrap{touch-action: none;}
  /* translate3d forza il layer GPU: fondamentale per fluidità durante drag/scroll */
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;transform:translate3d(0,0,0);}
  .g-tile{
    position:absolute;
    overflow:hidden;
    will-change:transform;
    transform:translateZ(0); /* ogni tile sul proprio layer, evita repaint del canvas intero */
    background:#111; /* placeholder mentre l'immagine carica, evita flash bianco */
  }
  .g-tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}

  #lightbox{position:fixed;inset:0;z-index:8000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0);opacity:0;pointer-events:none;transition:background .4s,opacity .4s;}
  #lightbox.is-open{background:rgba(0,0,0,.95);opacity:1;pointer-events:auto;}
  /* touch-action:none sul lightbox e sulla sua immagine: mentre una foto è
     aperta a schermo intero, NESSUN tipo di zoom deve essere possibile
     (né quello nativo del browser, né quello custom della griglia) —
     altrimenti lo zoom nativo del browser resta "appiccicato" a livello di
     pagina anche dopo aver chiuso il lightbox, disallineandosi dal nostro
     zoom JS della griglia sottostante. */
  #lightbox{touch-action:none;}
  #lightbox img{max-width:90vw;max-height:90vh;object-fit:contain;transform:scale(.92);transition:transform .4s cubic-bezier(.22,1,.36,1);touch-action:none;}
  #lightbox.is-open img{transform:scale(1);}

  /* hamburger */
  #hamburger span{transition:transform 0.3s ease,opacity 0.3s ease,background 0.3s ease;}
  #hamburger.is-open span:nth-child(1){transform:translateY(6px) rotate(45deg);background:#fff;}
  #hamburger.is-open span:nth-child(2){opacity:0;}
  #hamburger.is-open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);background:#fff;}
  #mobile-menu{transition:opacity 0.35s ease;}

    justify-content:center;
    pointer-events:none;
  }
  #loader.is-done{
    transition:opacity 0.6s ease;
    opacity:0;

<script>
/* ══ Navbar — stato attivo ══ */
(function setNavActive() {
  const currentFile = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('[data-nav]').forEach(link => {
    const navKey = link.dataset.nav;
    const isActive = navKey === 'home'
      ? (currentFile === 'index.html' || currentFile === '')
      : link.getAttribute('href').split('?')[0] === currentFile;
    if (isActive) link.classList.add('nav-active');
  });
})();

/* ══ Hamburger menu mobile ══ */
const hamburger  = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');

hamburger.addEventListener('click', () => {
  const open = hamburger.classList.toggle('is-open');
  if (open) {
    mobileMenu.classList.remove('hidden');
    mobileMenu.classList.add('flex');
  } else {
    mobileMenu.classList.add('hidden');
    mobileMenu.classList.remove('flex');
  }
  mobileMenu.classList.toggle('is-open', open);
  document.body.style.overflow = open ? 'hidden' : '';
});

hamburger.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') hamburger.click();
});

mobileMenu.querySelectorAll('a').forEach(a => {
  a.addEventListener('click', () => {
    hamburger.classList.remove('is-open');
    mobileMenu.classList.remove('is-open', 'flex');
    mobileMenu.classList.add('hidden');
    document.body.style.overflow = '';
  });
});

/* ══ Scramble GSAP sui link desktop ══ */
(() => {
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  document.querySelectorAll('header:not(#mobile-menu) nav a').forEach(link => {
    const original = link.textContent.trim();
    let tween = null;
    const buildSpans = (text) => {
      link.innerHTML = '';
      return text.split('').map(ch => {
        const span = document.createElement('span');
        span.className = 'scramble-char';
        span.textContent = ch;
        link.appendChild(span);
        return span;
      });
    };
    buildSpans(original);
    link.addEventListener('mouseenter', () => {
      if (tween) tween.kill();
      const spans = buildSpans(original);
      spans.forEach((span, i) => {
        if (original[i] === ' ') return;
        const maxIter = 6 + Math.floor(Math.random() * 4);
        tween = gsap.to(span, {
          duration: 0.03, repeat: maxIter, delay: i * 0.025,
          onRepeat:   () => { span.textContent = CHARS[Math.floor(Math.random() * CHARS.length)]; },
          onComplete: () => { span.textContent = original[i]; }
        });
      });
    });
  });
})();
</script>

<script>
(function(){

/* ══════════════════════════════════════════════════════════════════
   TUTTE le immagini del portfolio, in un unico array piatto.
   Nessuna categoria: vengono mescolate casualmente da shufl() più sotto,
   quindi compaiono mischiate tra loro nella griglia infinita.
   ══════════════════════════════════════════════════════════════════ */
const IMAGES=[
  'images/landscape/landscape-01.webp','images/landscape/landscape-02.webp',
  'images/landscape/landscape-03.webp','images/landscape/landscape-04.webp',
  'images/landscape/landscape-05.webp','images/landscape/landscape-06.webp',
  'images/landscape/landscape-07.webp','images/landscape/landscape-08.webp',
  'images/landscape/landscape-09.webp','images/landscape/landscape-10.webp',
  'images/landscape/landscape-11.webp','images/landscape/landscape-12.webp',
  'images/landscape/landscape-13.webp','images/landscape/landscape-14.webp',
  'images/landscape/landscape-15.webp','images/landscape/landscape-16.webp',
  'images/landscape/landscape-17.webp','images/landscape/landscape-18.webp',
  'images/landscape/landscape-19.webp','images/landscape/landscape-20.webp',
  'images/landscape/landscape-21.webp','images/landscape/landscape-22.webp',
  'images/landscape/landscape-23.webp','images/landscape/landscape-24.webp',
  'images/landscape/landscape-25.webp','images/landscape/landscape-26.webp',
  'images/landscape/landscape-27.webp','images/landscape/landscape-28.webp',

  'images/landscape/moon-1.webp','images/landscape/moon-2.webp',
  'images/landscape/moon-3.webp','images/landscape/moon-4.webp',
  'images/landscape/moon-5.webp','images/landscape/moon-6.webp',

  'images/street/street-01.webp','images/street/street-02.webp',
  'images/street/street-03.webp','images/street/street-04.webp',
  'images/street/street-05.webp','images/street/street-06.webp',
  'images/street/street-07.webp','images/street/street-08.webp',
  'images/street/street-09.webp','images/street/street-10.webp',
  'images/street/street-11.webp','images/street/street-12.webp',
  'images/street/street-13.webp','images/street/street-14.webp',
  'images/street/street-15.webp','images/street/street-16.webp',
  'images/street/street-17.webp','images/street/street-18.webp',
  'images/street/street-19.webp','images/street/street-20.webp',
  'images/street/street-21.webp','images/street/street-22.webp',
  'images/street/street-23.webp',

  'images/portraits/portraits-01.webp','images/portraits/portraits-02.webp',
  'images/portraits/portraits-03.webp','images/portraits/portraits-04.webp',
  'images/portraits/portraits-05.webp','images/portraits/portraits-06.webp',
  'images/portraits/portraits-07.webp','images/portraits/portraits-08.webp',
  'images/portraits/portraits-09.webp','images/portraits/portraits-10.webp',
  'images/portraits/portraits-11.webp','images/portraits/portraits-12.webp',
  'images/portraits/portraits-13.webp','images/portraits/portraits-14.webp',
  'images/portraits/portraits-15.webp','images/portraits/portraits-16.webp',
  'images/portraits/portraits-17.webp','images/portraits/portraits-18.webp',
  'images/portraits/portraits-19.webp','images/portraits/portraits-20.webp',
  'images/portraits/portraits-21.webp','images/portraits/portraits-22.webp',
  'images/portraits/portraits-23.webp','images/portraits/portraits-24.webp',
  'images/portraits/portraits-25.webp',

  'images/fine-art/fine-art-01.webp','images/fine-art/fine-art-02.webp',
  'images/fine-art/fine-art-03.webp','images/fine-art/fine-art-04.webp',
  'images/fine-art/fine-art-05.webp','images/fine-art/fine-art-06.webp',
  'images/fine-art/fine-art-07.webp','images/fine-art/fine-art-08.webp',
  'images/fine-art/fine-art-09.webp','images/fine-art/fine-art-10.webp',
  'images/fine-art/fine-art-11.webp','images/fine-art/fine-art-12.webp',
  'images/fine-art/fine-art-13.webp'
];

/* Colonne: leggermente ridotte rispetto all'originale per compensare
   il numero molto più alto di immagini e mantenere il DOM leggero */
const COL_VW = [11, 15, 9.5, 13, 10, 15.5, 12, 9, 14];
const GAP_VW = 1.5;
const MIN_ROWS = 8; /* ridotto da 10: con ~170 immagini bastano meno righe per riempire */

let blocks=[], TILE_W=0, TILE_H=0, ready=false;
let ratios=[];
let activeImages=IMAGES.slice();

/* PRNG deterministico per lo shuffle: stesso seed = stesso ordine,
   ma seed diverso ad ogni build => mix sempre diverso tra le categorie */
function shufl(arr,seed){
  const a=arr.slice(); let s=seed;
  const r=()=>{s=(s*9301+49297)%233280;return s/233280;};
  for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const vpx=v=>{
  const mobileScale = window.innerWidth<=1024 ? 1.6 : 1; /* tile più grandi su mobile/tablet */
  return window.innerWidth*v/100*mobileScale;
};

function build(){
  blocks=[];
  const N   = COL_VW.length;
  const gap = vpx(GAP_VW);
  const cw = COL_VW.map(v=>vpx(v));
  const colX=[];
  let sumX=0;
  for(let c=0;c<N;c++){colX.push(sumX);sumX+=cw[c]+gap;}
  TILE_W=Math.round(sumX);

  const pool=activeImages.map((src,i)=>({src,ratio:ratios[i]||1}));
  /* seed casuale ad ogni build: le immagini di categorie diverse
     risultano sempre mischiate, mai raggruppate */
  let seq=[]; let rd=Math.floor(Math.random()*100000);
  while(seq.length<N*30){seq=seq.concat(shufl(pool,rd*7919+13));rd++;}

  let si=0;
  const colH=new Array(N).fill(0);
  const cnt=new Array(N).fill(0);
  while(cnt.some(c=>c<MIN_ROWS)){
    let col=0;
    for(let c=1;c<N;c++){
      if(cnt[c]<MIN_ROWS && (cnt[col]>=MIN_ROWS || colH[c]<colH[col])) col=c;
    }
    if(cnt[col]>=MIN_ROWS) break;
    const img=seq[si%seq.length]; si++;
    const w=cw[col];
    const h=w/img.ratio;
    blocks.push({x:colX[col], y:colH[col], w, h, src:img.src});
    colH[col]+=h+gap;
    cnt[col]++;
  }

  let maxH=Math.max(...colH);
  for(let c=0;c<N;c++){
    while(colH[c]<maxH){
      const img=seq[si%seq.length]; si++;
      const w=cw[c];
      const h=w/img.ratio;
      blocks.push({x:colX[c], y:colH[c], w, h, src:img.src});
      colH[c]+=h+gap;
    }
  }

  /* ══ FIX overlap ══
     Le colonne, dopo il riempimento, possono "sforare" oltre maxH
     (l'ultima immagine aggiunta a una colonna raramente combacia
     esattamente). Se non corretto, TILE_H finiva per essere più
     piccolo dell'altezza reale di alcune colonne, e la tile
     successiva (che si ripete ogni TILE_H per lo scroll infinito)
     iniziava PRIMA che la colonna precedente fosse davvero finita:
     risultato, immagini sovrapposte.
     Qui si "rifila" (in altezza, con crop via object-fit:cover,
     quindi visivamente pulito) l'ultima immagine di ogni colonna
     che supera maxH, così TUTTE le colonne finiscono esattamente
     alla stessa altezza — niente più sovrapposizioni, gap sempre
     costante. */
  for(let c=0;c<N;c++){
    const overshoot = colH[c]-maxH;
    if(overshoot>0){
      for(let i=blocks.length-1;i>=0;i--){
        if(blocks[i].x===colX[c]){
          const minH = Math.max(cw[c]*0.4, 40); // altezza minima decente
          blocks[i].h = Math.max(blocks[i].h - overshoot, minH);
          break;
        }
      }
    }
  }

  TILE_H=Math.round(maxH);
  ready=true;
}

/* ══════════════════════════════════════════════════════════════════
   PRELOAD NON BLOCCANTE + LOADER identico alla home
   Con ~170 immagini aspettare che carichino tutte prima di mostrare
   qualsiasi cosa è il vero collo di bottiglia. Qui si costruisce
   subito la griglia con rapporto 1:1 provvisorio, poi si corregge
   una sola volta in background quando tutte le dimensioni reali
   sono note (nessun jank percepibile, l'utente può già muoversi).
   Il loader mostra l'avanzamento reale del caricamento immagini,
   ma usa lo stesso identico markup/stile/animazione della home.
   ══════════════════════════════════════════════════════════════════ */
function preload(cb){
  activeImages = IMAGES.slice();
  ratios = activeImages.map(()=>1);
  build();
  cb();

  const loader  = document.getElementById('loader');
  const counter = document.getElementById('loader-counter');

  const finishLoader = () => {
    if (!loader) return;
    loader.classList.add('is-done');
    loader.addEventListener('transitionend', () => loader.remove(), { once: true });
  };

  const total = activeImages.length;

  /* ══ Caricamento a concorrenza limitata ══
     Prima si scaricavano TUTTE le immagini contemporaneamente solo per
     conoscerne le proporzioni reali: su mobile questo satura la connessione
     e rallenta tutto. Ora se ne caricano solo MAX_CONCURRENT alla volta, e:
     - la griglia diventa utilizzabile dopo le prime EARLY_REVEAL immagini
       (non dopo tutte le ~90), quindi si vede e si usa molto prima
     - il resto continua a caricare in background, aggiornando il mosaico
       via via (rebuild parziali), non tutto in un unico salto alla fine ══ */
  const MAX_CONCURRENT = 6;
  const EARLY_REVEAL    = Math.min(28, total);

  let done = 0;
  let started = 0;
  let earlyRevealed = false;
  let nextRebuildAt = 12;

  function loadOne(i){
    const src = activeImages[i];
    const img = new Image();
    const fin = () => {
      done++;
      if (counter) counter.textContent = String(Math.round((done/total)*100));

      if (!earlyRevealed && done >= EARLY_REVEAL) {
        earlyRevealed = true;
        finishLoader();
        rebuildKeepingCameraPartial();
      }
      if (done >= nextRebuildAt && done < total) {
        nextRebuildAt += 20; // aggiornamenti progressivi del mosaico, non solo alla fine
        rebuildKeepingCameraPartial();
      }
      if (done >= total) {
        if (!earlyRevealed) finishLoader();
        rebuildKeepingCamera(); // solo qui, a caricamento TOTALE finito, si scartano le eventuali immagini fallite
      }

      startNext();
    };
    img.onload  = () => { ratios[i] = (img.naturalWidth||1)/(img.naturalHeight||1); fin(); };
    img.onerror = () => { ratios[i] = 0; fin(); };
    img.src = src;
  }

  function startNext(){
    if (started >= total) return;
    const i = started++;
    loadOne(i);
  }

  const firstBatch = Math.min(MAX_CONCURRENT, total);
  for (let k = 0; k < firstBatch; k++) startNext();
}

function pruneMissingImages(){
  const keptImages=[];
  const keptRatios=[];
  activeImages.forEach((src,i)=>{
    if(ratios[i]>0){
      keptImages.push(src);
      keptRatios.push(ratios[i]);
    }
  });
  activeImages = keptImages;
  ratios = keptRatios;
}

/* Rebuild "leggero" usato DURANTE il caricamento: NON scarta mai immagini
   (niente pruneMissingImages), perché il caricamento a coda usa ancora gli
   indici originali — scartare elementi a metà caricamento sfaserebbe gli
   indici e assocerebbe le proporzioni alle foto sbagliate. Lo scarto delle
   immagini eventualmente fallite avviene solo a caricamento totale concluso,
   dentro rebuildKeepingCamera(). */
function rebuildKeepingCameraPartial(){
  const relX=camX, relY=camY;
  [...tpool.keys()].forEach(killT);
  build();
  camX=relX; camY=relY;
  lastTx=lastTy=null;
  sync();
}

function rebuildKeepingCamera(){
  const relX=camX, relY=camY;
  [...tpool.keys()].forEach(killT);
  pruneMissingImages();
  build();
  camX=relX; camY=relY;
  lastTx=lastTy=null;
  sync();
}

let camX=0,camY=0;
let dvx=.28,dvy=.14;
let drag=false,lx=0,ly=0,uvx=0,uvy=0,lt=0,tot=0,dtgt=null;
const DECAY=.9985, MIND=.15;

const cvs=document.getElementById('canvas');
const wrap=document.getElementById('canvas-wrap');
const hint=document.getElementById('hint');
const tpool=new Map();
const key=(a,b)=>`${a},${b}`;

function makeTile(tx,ty){
  const els=[];
  const ox=tx*TILE_W, oy=ty*TILE_H;
  const frag=document.createDocumentFragment(); /* un solo reflow invece di N */
  blocks.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='g-tile';
    /* Math.round: evita micro-overlap/gap tra tile adiacenti causati da
       arrotondamenti diversi che i browser applicano a coordinate frazionarie */
    el.style.left  =Math.round(ox+b.x)+'px';
    el.style.top   =Math.round(oy+b.y)+'px';
    el.style.width =Math.round(b.w)+'px';
    el.style.height=Math.round(b.h)+'px';
    el.style.zIndex=i;
    el.dataset.src=b.src;
    const img=document.createElement('img');
    img.src=b.src; img.loading='lazy'; img.decoding='async';
    img.draggable=false;
    el.appendChild(img);
    frag.appendChild(el);
    els.push(el);
  });
  cvs.appendChild(frag);
  return els;
}
function killT(k){const e=tpool.get(k);if(e){e.forEach(n=>n.remove());tpool.delete(k);}}

function sync(){
  if(!ready)return;
  /* Con lo zoom, la posizione "mondo" al centro schermo va calcolata
     tenendo conto della scala (transform-origin è 0,0 su #canvas):
     screenX = camX + worldX*scale  →  worldX = (screenCenterX - camX) / scale */
  const px=(window.innerWidth /2 - camX) / camScale;
  const py=(window.innerHeight/2 - camY) / camScale;
  const tx=Math.floor(px/TILE_W);
  const ty=Math.floor(py/TILE_H);
  /* Zoomati indietro (camScale piccolo), lo schermo copre più "mondo":
     serve un raggio di tile maggiore per non lasciare buchi vuoti ai bordi. */
  const radius = Math.max(1, Math.ceil(1 / camScale));
  const need=new Set();
  for(let dx=-radius;dx<=radius;dx++) for(let dy=-radius;dy<=radius;dy++) need.add(key(tx+dx,ty+dy));
  for(const k of tpool.keys()) if(!need.has(k)) killT(k);
  for(const k of need) if(!tpool.has(k)){const[a,b]=k.split(',').map(Number);tpool.set(k,makeTile(a,b));}
}

/* Cache dell'ultima tile centrale: sync() ricalcola i confini solo
   quando l'utente ha davvero attraversato una tile, non ad ogni frame */
let lastTx=null, lastTy=null;
function syncIfNeeded(){
  if(!ready)return;
  const px=(window.innerWidth /2 - camX) / camScale;
  const py=(window.innerHeight/2 - camY) / camScale;
  const tx=Math.floor(px/TILE_W);
  const ty=Math.floor(py/TILE_H);
  if(tx===lastTx && ty===lastTy) return;
  lastTx=tx; lastTy=ty;
  sync();
}

/* ══════════════════════════════════════════════════════════════════
   ZOOM — pinch a due dita (touch) e rotellina/trackpad con Ctrl/Cmd (desktop)
   ══════════════════════════════════════════════════════════════════ */
let camScale = 1;
const MIN_SCALE = 0.35, MAX_SCALE = 3;
let lastSyncScale = 1;

function applyTransform(){
  cvs.style.transform = `translate3d(${camX}px,${camY}px,0) scale(${camScale})`;
  /* Dopo un cambio di scala consistente, forziamo un resync immediato:
     a scale diverse serve un numero diverso di tile per coprire lo schermo
     (vedi radius in sync()), altrimenti restano vuoti ai bordi o si
     sovrappongono contenuti non necessari. */
  if (Math.abs(camScale - lastSyncScale) > 0.12) {
    lastSyncScale = camScale;
    lastTx = lastTy = null;
    sync();
  }
}

/* Zoom "ancorato" a un punto dello schermo (cursore o centro del pinch):
   il punto mondo che si trova sotto quel punto resta visivamente fermo
   sotto di esso anche dopo il cambio di scala, invece di far "scappare"
   la griglia da sotto le dita/cursore. */
function zoomAt(ax, ay, newScale){
  newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
  const factor = newScale / camScale;
  camX = ax - (ax - camX) * factor;
  camY = ay - (ay - camY) * factor;
  camScale = newScale;
  applyTransform();
}

function tick(){
  if(!ready){requestAnimationFrame(tick);return;}
  if(!drag){
    camX+=dvx; camY+=dvy;
    dvx*=DECAY; dvy*=DECAY;
    const sp=Math.hypot(dvx,dvy);
    if(sp>0&&sp<MIND){const s=MIND/sp;dvx*=s;dvy*=s;}
  }
  syncIfNeeded();
  applyTransform();
  requestAnimationFrame(tick);
}

function dn(x,y,t){drag=true;document.body.classList.add('is-dragging');lx=x;ly=y;uvx=uvy=0;lt=performance.now();tot=0;dtgt=t||null;hint.style.opacity='0';}
function mv(x,y){
  if(!drag)return;
  const dx=x-lx,dy=y-ly,dt=Math.max(performance.now()-lt,1);
  camX+=dx;camY+=dy;tot+=Math.hypot(dx,dy);
  uvx=dx*(16/dt)*.45;uvy=dy*(16/dt)*.45;
  lx=x;ly=y;lt=performance.now();
}
function up(){
  if(!drag)return;
  drag=false;document.body.classList.remove('is-dragging');
  /* recentlyPinched: se il gesto arrivava da un pinch a due dita, NON deve
     mai aprire l'immagine sotto il dito rimasto, anche se il movimento
     residuo è minimo — altrimenti terminare uno zoom equivale a un "tap". */
  if(tot<6&&dtgt&&!recentlyPinched){const t=dtgt.closest?.('.g-tile');if(t)tgl(t.dataset.src);}
  if(Math.hypot(uvx,uvy)>MIND){dvx=uvx;dvy=uvy;}
}

let lastTouchTime=0;
let isPinching=false; /* true mentre l'utente sta pizzicando con due dita per zoomare */
let recentlyPinched=false; /* resta true per l'intera durata del gesto dopo un pinch */
let pinchStartDist=null, pinchStartScale=1, lastMidX=0, lastMidY=0;

document.addEventListener('mousedown', e=>{
  if(Date.now()-lastTouchTime<800)return; /* ignora il "ghost click" dopo un touch */
  if(lb.classList.contains('is-open'))return; // lightbox aperto: niente pan della griglia
  e.preventDefault();dn(e.clientX,e.clientY,e.target);
});
document.addEventListener('dragstart', e=>e.preventDefault());
document.addEventListener('selectstart', e=>{if(drag)e.preventDefault();});
document.addEventListener('mousemove', e=>{if(Date.now()-lastTouchTime<800)return;mv(e.clientX,e.clientY);});
document.addEventListener('mouseup',   e=>{if(Date.now()-lastTouchTime<800)return;up();});
document.addEventListener('mouseleave',up);

wrap.addEventListener('touchstart', e=>{
  lastTouchTime=Date.now();
  if (lb.classList.contains('is-open')) return; // lightbox aperto: nessun gesto sulla griglia sottostante
  if(e.touches.length>1){
    /* Due dita: avvio dello zoom (pinch). Interrompiamo qualsiasi drag
       a un dito in corso e prendiamo come riferimento la distanza e il
       punto medio iniziale tra le due dita. */
    isPinching = true;
    recentlyPinched = true;
    if (drag) up();
    const [a,b] = e.touches;
    pinchStartDist  = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    pinchStartScale = camScale;
    lastMidX = (a.clientX+b.clientX)/2;
    lastMidY = (a.clientY+b.clientY)/2;
    hint.style.opacity='0';
    return;
  }
  /* Un solo dito e nessun altro presente: gesto genuinamente nuovo,
     resettiamo il flag del pinch precedente. */
  isPinching = false;
  recentlyPinched = false;
  const t=e.touches[0];
  dn(t.clientX,t.clientY,t.target);
},{passive:true});

wrap.addEventListener('touchmove', e=>{
  lastTouchTime=Date.now();
  if (lb.classList.contains('is-open')) return; // lightbox aperto: nessun gesto sulla griglia

  if(e.touches.length>1){
    /* Pinch-zoom a due dita: la distanza tra le dita determina la scala,
       il punto medio determina sia il pan (se le dita si spostano insieme)
       sia il punto di ancoraggio dello zoom. */
    e.preventDefault();
    const [a,b] = e.touches;
    const dist = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const mx = (a.clientX+b.clientX)/2;
    const my = (a.clientY+b.clientY)/2;

    if (pinchStartDist) {
      // pan dal movimento del punto medio
      camX += (mx - lastMidX);
      camY += (my - lastMidY);
      // zoom ancorato al punto medio corrente
      const newScale = pinchStartScale * (dist / pinchStartDist);
      zoomAt(mx, my, newScale);
    }
    lastMidX = mx; lastMidY = my;
    return;
  }

  if(isPinching){
    /* Una sola dita rimasta ma arriviamo da un pinch: non facciamo pan
       automaticamente in questo frame, aspettiamo touchend per resettare
       lo stato in modo pulito (evita un salto improvviso della griglia). */
    return;
  }

  e.preventDefault();
  mv(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});

wrap.addEventListener('touchend', e=>{
  lastTouchTime=Date.now();

  if(e.touches.length===1 && isPinching){
    /* Da due dita si è passati a una sola: riprendiamo il pan normale
       da dove si trova ora l'unico dito rimasto, senza scatti — ma il
       flag recentlyPinched resta attivo, quindi il rilascio finale di
       questo stesso dito non aprirà mai un'immagine per errore. */
    isPinching = false;
    pinchStartDist = null;
    const t=e.touches[0];
    dn(t.clientX,t.clientY,t.target);
    return;
  }
  if(e.touches.length>0) return; // altre dita ancora presenti, aspettiamo

  isPinching = false;
  pinchStartDist = null;
  e.preventDefault();
  up();
  recentlyPinched = false; // gesto concluso del tutto: da qui riparte pulito
},{passive:false});


/* ══ Scroll: si somma al drag, funziona in tutte le direzioni,
   e l'infinito è già garantito dal wrap modulare di sync() ══
   Ctrl/Cmd + rotellina, o pinch su trackpad (che il browser riporta come
   wheel con ctrlKey=true): zoom invece di pan. ══ */
wrap.addEventListener('wheel', e => {
  if (lb.classList.contains('is-open')) return; // lightbox aperto: niente zoom/pan sulla griglia
  e.preventDefault();
  hint.style.opacity='0';

  if (e.ctrlKey || e.metaKey) {
    const newScale = camScale * (1 - e.deltaY * 0.01);
    zoomAt(e.clientX, e.clientY, newScale);
    dvx = dvy = 0;
    return;
  }

  camX -= e.deltaX * 0.9;
  camY -= e.deltaY * 0.9;
  dvx = dvy = 0; /* niente drift automatico mentre l'utente sta scrollando */
}, { passive:false });

const lb=document.getElementById('lightbox'),lbi=document.getElementById('lightbox-img');
function tgl(src){lb.classList.contains('is-open')?lb.classList.remove('is-open'):(lbi.src=src,lb.classList.add('is-open'));}
lb.addEventListener('click',()=>lb.classList.remove('is-open'));
lb.addEventListener('touchend',e=>{
  if(e.touches.length>0) return; /* niente chiusura se l'utente sta ancora pizzicando con più dita */
  e.preventDefault();
  lb.classList.remove('is-open');
});

/* ══ Reset dello stato quando la pagina torna visibile da bfcache
   (es. dopo aver premuto "indietro" nel browser): senza questo,
   il lightbox e lo stato di drag potrebbero restare "congelati"
   aperti/attivi così come erano prima di lasciare la pagina. ══ */
function resetGalleryState() {
  lb.classList.remove('is-open');
  isPinching = false;
  recentlyPinched = false;
  pinchStartDist = null;
  if (drag) up();
  document.body.classList.remove('is-dragging');
}

window.addEventListener('pageshow', (e) => {
  if (e.persisted) resetGalleryState();
});

/* Rete di sicurezza extra: se in futuro si aggiunge navigazione con
   history.pushState (come già avviene in projects.html), "indietro"
   deve comunque chiudere il lightbox invece di lasciarlo aperto. */
window.addEventListener('popstate', resetGalleryState);

/* Se la scheda torna visibile (es. cambio app su mobile e poi ritorno)
   assicuriamoci che il lightbox non resti bloccato in uno stato strano */
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    isPinching = false;
  }
});

let rt;
window.addEventListener('resize',()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    [...tpool.keys()].forEach(killT);
    lastTx=lastTy=null;
    build();
    camX=-TILE_W/2+window.innerWidth/2;
    camY=-TILE_H/2+window.innerHeight/2;
    sync();
  },200);
});

preload(()=>{
  camX=-TILE_W/2+window.innerWidth/2;
  camY=-TILE_H/2+window.innerHeight/2;
  sync();
});
requestAnimationFrame(tick);

})();
</script>
</body>
</html>
