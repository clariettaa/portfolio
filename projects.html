        /* ── Hamburger ── */
        #hamburger span { transition: transform 0.3s ease, opacity 0.3s ease; }
        #hamburger.is-open span:nth-child(1) { transform: translateY(6px) rotate(45deg);  }
        #hamburger.is-open span:nth-child(2) { opacity: 0; }

           davvero fixed sullo schermo; solo il contenuto viene smussato ── */
        #smooth-wrapper { position: fixed; inset: 0; overflow: hidden; }
        #smooth-content { width: 100%; }

        /* ── Vista 1: scroll infinito ── */
        #loop-wrap  { position: relative; width: 100%; height: 100vh; overflow: hidden; }
        #loop-track { position: absolute; top: 0; left: 0; width: 100%; will-change: transform; }

        .portfolio-item {
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1.5vw, 1.5rem);
            color: white;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding: clamp(0.8rem, 1.5vw, 1.5rem) 0;
            opacity: 0.2;
            cursor: pointer;
            transition: none; /* hover ISTANTANEO */
            position: relative;
            z-index: 2;
        }
        .portfolio-item:hover { opacity: 1; }
        .portfolio-item .item-num { opacity: 0.4; transition: none; }
        .portfolio-item:hover .item-num { opacity: 1; }

        /* ── Preview fissa a destra ── */
        #hover-preview {
            position: fixed;
            top: 50%; right: 5%;
            transform: translateY(-50%);
            width: clamp(50vw, 400px, 400px);
            pointer-events: none;
            opacity: 0;
            transition: none; /* appare/sparisce ISTANTANEA */
            border-radius: 2px;
            overflow: hidden;
            z-index: 1;
        }
        #hover-preview.visible { opacity: 1; }
        #hover-preview img { width: 100%; height: auto; display: block; }

        /* ── Vista 2: dettaglio categoria ── */
        #detail-view {
            position: fixed; inset: 0;
            background: black;
            z-index: 200;
            overflow-y: auto;
            opacity: 0; pointer-events: none;
            transform: translateY(20px);
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        #detail-view.open { opacity: 1; pointer-events: auto; transform: translateY(0); }

        #detail-grid { columns: 2; column-gap: 1.2vw; }
        @media (min-width: 800px) { #detail-grid { columns: 3; } }
        #detail-grid img {
            width: 100%; height: auto; display: block;
            margin: 0 0 1.2vw;
            break-inside: avoid; cursor: pointer;
            transition: opacity 0.25s ease;
        }
        #detail-grid img:hover { transform: scale(0.98); }

        /* ── Lightbox fullscreen ── */
        #lightbox {
            position: fixed; inset: 0; z-index: 8000;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0); opacity: 0; pointer-events: none;
            transition: background .4s, opacity .4s;
        }
        #lightbox.is-open { background: rgba(0,0,0,.95); opacity: 1; pointer-events: auto; }
        #lightbox img {
            max-width: 90vw; max-height: 90vh; object-fit: contain;
            transform: scale(.92); transition: transform .4s cubic-bezier(.22,1,.36,1);
        }
        #lightbox.is-open img { transform: scale(1); }

			color: #000;
		}

const ORDER = Object.keys(PROJECTS);

/* Prima immagine di ogni categoria come anteprima hover.
   Viene letta in automatico da PROJECTS — non serve aggiornarla. */
const PREVIEW = {};
ORDER.forEach(cat => { PREVIEW[cat] = PROJECTS[cat].images[0] || ''; });

/* ══════════════════════════════════════════════════════════════════
   SCROLL INFINITO
   ══════════════════════════════════════════════════════════════════ */
const track = document.getElementById('loop-track');
const items = Array.from(track.children);
const N     = items.length;

/* Numera le voci */
items.forEach((item, i) => {
    const label = item.textContent.trim();
    const num   = String(i + 1).padStart(2, '0');
    item.innerHTML =
        `<span class="item-num font-subtitle">${num}</span>` +
        `<span>${label}</span>`;
});

/* Duplica finché il track è almeno 3× l'altezza della viewport */
function fill() {
    let h = track.getBoundingClientRect().height;
    while (h < window.innerHeight * 3) {
        items.forEach(it => track.appendChild(it.cloneNode(true)));
        h = track.getBoundingClientRect().height;
    }
}
fill();

function loopH() {
    return track.getBoundingClientRect().height / (track.children.length / N);
}
let LOOP_H = loopH();

let vs = 0, ts = 0, scrollLock = false;

window.addEventListener('wheel', e => {
    if (scrollLock) return;
    e.preventDefault();
    ts += e.deltaY;
}, { passive: false });

let ty = 0;
window.addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchmove',  e => {
    if (scrollLock) return;
    ts += (ty - e.touches[0].clientY) * 1.5;
    ty  = e.touches[0].clientY;
}, { passive: true });

(function loop() {
    vs += (ts - vs) * 0.09;
    gsap.set(track, { y: -gsap.utils.wrap(0, LOOP_H, vs) });
    requestAnimationFrame(loop);
})();

window.addEventListener('resize', () => { LOOP_H = loopH(); });

/* ══════════════════════════════════════════════════════════════════
   HOVER PREVIEW — istantanea, nessuna transition
   ══════════════════════════════════════════════════════════════════ */
const preview    = document.getElementById('hover-preview');
const previewImg = document.getElementById('hover-preview-img');

track.addEventListener('mouseover', e => {
    const item = e.target.closest('.portfolio-item');
    if (!item) return;
    const src = PREVIEW[item.dataset.cat];
    if (src) { previewImg.src = src; preview.classList.add('visible'); }
});

track.addEventListener('mouseout', e => {
    const item = e.target.closest('.portfolio-item');
    if (!item) return;
    if (e.relatedTarget?.closest?.('.portfolio-item')) return;
    preview.classList.remove('visible');
});

/* ══════════════════════════════════════════════════════════════════
   LIGHTBOX — apertura a schermo intero al click su un'immagine
   ══════════════════════════════════════════════════════════════════ */
const lb  = document.getElementById('lightbox');
const lbi = document.getElementById('lightbox-img');

function openLightbox(src) {
    lbi.src = src;
    lb.classList.add('is-open');
}
function closeLightbox() {
    lb.classList.remove('is-open');
}

document.getElementById('detail-grid').addEventListener('click', e => {
    const img = e.target.closest('img');
    if (img) openLightbox(img.src);
});

lb.addEventListener('click', closeLightbox);
lb.addEventListener('touchend', e => { e.preventDefault(); closeLightbox(); });

/* ══════════════════════════════════════════════════════════════════
   VISTA 2 — DETTAGLIO
   ══════════════════════════════════════════════════════════════════ */
const detailView = document.getElementById('detail-view');

function openDetail(cat) {
    const data = PROJECTS[cat];
    if (!data) return;

    const idx   = ORDER.indexOf(cat);
    const prev  = ORDER[(idx - 1 + ORDER.length) % ORDER.length];
    const next  = ORDER[(idx + 1) % ORDER.length];

    document.getElementById('detail-title').textContent = data.title;
    document.getElementById('detail-index').textContent =
        `${String(idx + 1).padStart(2,'0')} / ${String(ORDER.length).padStart(2,'0')}`;

    /* Griglia foto */
    const grid = document.getElementById('detail-grid');
    grid.innerHTML = '';
    data.images.forEach(src => {
        const img = document.createElement('img');
        img.src = src; img.alt = data.title;
        grid.appendChild(img);
    });

    /* Prev / Next */
    const bp = document.getElementById('detail-prev');
    const bn = document.getElementById('detail-next');
    bp.textContent = `← ${PROJECTS[prev].title}`;
    bn.textContent = `${PROJECTS[next].title} →`;
    bp.onclick = e => { e.preventDefault(); openDetail(prev); };
    bn.onclick = e => { e.preventDefault(); openDetail(next); };

    detailView.scrollTop = 0;
    detailView.classList.add('open');
    scrollLock = true;
    preview.classList.remove('visible');

    history.pushState({ cat }, '', `projects.html?cat=${cat}`);
    document.title = `Clarietta — ${data.title}`;
}

function closeDetail() {
    detailView.classList.remove('open');
    scrollLock = false;
    history.pushState({}, '', 'projects.html');
    document.title = 'Clarietta — Projects';
}

/* Click su voce della lista */
track.addEventListener('click', e => {
    const item = e.target.closest('.portfolio-item');
    if (item) { e.preventDefault(); openDetail(item.dataset.cat); }
});

document.getElementById('detail-back').addEventListener('click', e => {
    e.preventDefault(); closeDetail();
});

/* Tasto indietro del browser */
window.addEventListener('popstate', e => {
    e.state?.cat ? openDetail(e.state.cat) : closeDetail();
});

/* Caricamento diretto con ?cat=... nell'URL */
(function () {
    const cat = new URLSearchParams(window.location.search).get('cat');
    if (cat && PROJECTS[cat]) openDetail(cat);
})();

/* ══════════════════════════════════════════════════════════════════
   NAVBAR — link attivo
   ══════════════════════════════════════════════════════════════════ */
(function () {
    const file = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('[data-nav]').forEach(a => {
        const active = a.dataset.nav === 'projects'
            ? file === 'projects.html'
            : a.getAttribute('href').split('?')[0] === file;
        if (active) a.classList.add('nav-active');
    });
})();

/* ══════════════════════════════════════════════════════════════════
   HAMBURGER MOBILE
   ══════════════════════════════════════════════════════════════════ */
const hamburger  = document.getElementById('hamburger');
const mobileMenu = document.getElementById('mobile-menu');

hamburger.addEventListener('click', () => {
    const open = hamburger.classList.toggle('is-open');
    mobileMenu.classList.toggle('hidden',  !open);
    mobileMenu.classList.toggle('flex',     open);
    mobileMenu.classList.toggle('is-open',  open);
    document.body.style.overflow = open ? 'hidden' : '';
});

mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', () => {
    hamburger.classList.remove('is-open');
    mobileMenu.classList.remove('is-open', 'flex');
    mobileMenu.classList.add('hidden');
    document.body.style.overflow = '';
}));

/* ══════════════════════════════════════════════════════════════════
   SCRAMBLE — link navbar desktop
   ══════════════════════════════════════════════════════════════════ */
(function () {
    const ABC = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

    document.querySelectorAll('header.hidden nav a').forEach(link => {
        const orig = link.textContent.trim();
        let tw = null;

        const spans = txt => {
            link.innerHTML = '';
            return [...txt].map(ch => {
                const s = document.createElement('span');
                s.className = 'scramble-char';
                s.textContent = ch;
                link.appendChild(s);
                return s;
            });
        };

        spans(orig);

        link.addEventListener('mouseenter', () => {
            if (tw) tw.kill();
            spans(orig).forEach((s, i) => {
                if (orig[i] === ' ') return;
                tw = gsap.to(s, {
                    duration: 0.03,
                    repeat:   6 + Math.floor(Math.random() * 4),
                    delay:    i * 0.025,
                    onRepeat:   () => { s.textContent = ABC[Math.floor(Math.random() * ABC.length)]; },
                    onComplete: () => { s.textContent = orig[i]; }
                });
            });
        });
    });
})();

</script>
</body>
